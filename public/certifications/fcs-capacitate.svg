<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="fcsbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#001833"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#fcsbg)"/>
  <rect x="2" y="2" width="92" height="92" rx="18" fill="none" stroke="#ffd60a" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Graduation Cap and Laurel Wreath -->
  <g transform="translate(48, 40)">
    <!-- Cap top diamond -->
    <polygon points="0,-16 26,-5 0,6 -26,-5" fill="#ffd60a"/>
    <!-- Cap under -->
    <polygon points="-16,0 0,6 16,0 16,7 0,13 -16,7" fill="#ffc300"/>
    <!-- Tassel -->
    <path d="M20,-2 L24,10 L22,12 L20,10 Z" fill="#ffd60a"/>
    <circle cx="22" cy="12" r="1.5" fill="#ffd60a"/>
    <!-- Laurel Wreath Base -->
    <path d="M-22,14 C-15,22 15,22 22,14" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-16" cy="18" r="2" fill="#ffd60a"/>
    <circle cx="0" cy="21" r="2.5" fill="#ffd60a"/>
    <circle cx="16" cy="18" r="2" fill="#ffd60a"/>
  </g>
  <text x="48" y="78" fill="#ffd60a" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="1">CAPACÍTATE</text>
  <text x="48" y="87" fill="#90caf9" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">FUNDACIÓN CARLOS SLIM</text>
</svg>
