<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="gnetbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#gnetbg)" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Google 4-Color Network Top Bar -->
  <g transform="translate(28, 14)">
    <rect x="0" y="0" width="9" height="3" rx="1.5" fill="#4285f4"/>
    <rect x="11" y="0" width="9" height="3" rx="1.5" fill="#ea4335"/>
    <rect x="22" y="0" width="9" height="3" rx="1.5" fill="#fbbc05"/>
    <rect x="33" y="0" width="9" height="3" rx="1.5" fill="#34a853"/>
  </g>
  <!-- Interconnected Network Graph -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <line x1="48" y1="30" x2="28" y2="48"/>
    <line x1="48" y1="30" x2="68" y2="48"/>
    <line x1="28" y1="48" x2="48" y2="64"/>
    <line x1="68" y1="48" x2="48" y2="64"/>
    <line x1="28" y1="48" x2="68" y2="48"/>
  </g>
  <!-- 4 Colored Google Nodes -->
  <circle cx="48" cy="30" r="7" fill="#4285f4"/>
  <circle cx="28" cy="48" r="7" fill="#ea4335"/>
  <circle cx="68" cy="48" r="7" fill="#34a853"/>
  <circle cx="48" cy="64" r="7" fill="#fbbc05"/>
  <!-- Center router icon -->
  <circle cx="48" cy="48" r="4.5" fill="#0f172a"/>
  <circle cx="48" cy="48" r="2" fill="#ffffff"/>
  <text x="48" y="83" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="1.5">NETWORKS</text>
</svg>
