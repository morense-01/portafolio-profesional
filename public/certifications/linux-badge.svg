<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="linuxbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#linuxbg)"/>
  <rect x="2" y="2" width="92" height="92" rx="18" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Tux penguin stylized icon -->
  <g transform="translate(48, 44)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#000000"/>
    <!-- Belly -->
    <ellipse cx="0" cy="4" rx="12" ry="16" fill="#ffffff"/>
    <!-- Flippers -->
    <ellipse cx="-16" cy="2" rx="4" ry="12" fill="#000000" transform="rotate(20 -16 2)"/>
    <ellipse cx="16" cy="2" rx="4" ry="12" fill="#000000" transform="rotate(-20 16 2)"/>
    <!-- Head / Eyes -->
    <circle cx="-5" cy="-10" r="3" fill="#ffffff"/>
    <circle cx="5" cy="-10" r="3" fill="#ffffff"/>
    <circle cx="-4" cy="-10" r="1.5" fill="#000000"/>
    <circle cx="4" cy="-10" r="1.5" fill="#000000"/>
    <!-- Beak -->
    <polygon points="-5,-5 5,-5 0,0" fill="#f59e0b"/>
    <!-- Feet -->
    <ellipse cx="-9" cy="22" rx="7" ry="3.5" fill="#f59e0b"/>
    <ellipse cx="9" cy="22" rx="7" ry="3.5" fill="#f59e0b"/>
  </g>
  <!-- Label -->
  <text x="48" y="84" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="2">LINUX</text>
</svg>
